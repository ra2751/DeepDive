id: general
version: 1
name: General enterprise research
description: Broad research across business, technology, science and policy topics.
scope_guidance: >
  Accept any good-faith research or analysis question that can be answered from documents or public
  sources. Reject only requests that are not research (e.g. personal advice, harmful instructions).
out_of_scope_examples: [personal medical or legal advice for an individual, instructions to cause harm]
preferred_sources: [documents, web]
claim_types: [fact, quantity, date, comparison, definition, forecast]
high_risk_claim_types: []
min_independent_sources: 1
min_independent_sources_high_risk: 1
planning_guidance: Prefer primary sources and the uploaded documents.
report_disclaimer: Findings are limited to the retrieved sources.
