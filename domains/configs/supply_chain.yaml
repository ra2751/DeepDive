id: supply_chain
version: 1
name: Supply chain research
description: Logistics, capacity, lead times, disruptions, inventory and supply-chain compliance.
scope_guidance: >
  Accept questions about logistics, manufacturing capacity, lead times, disruptions, inventory,
  trade and supply-chain compliance.
out_of_scope_examples: [personal travel planning]
preferred_sources: [documents, web]
claim_types: [lead_time, capacity, disruption, inventory, compliance, fact]
high_risk_claim_types: [disruption, compliance]
min_independent_sources: 1
min_independent_sources_high_risk: 1
human_review_high_risk: true
planning_guidance: Prefer recent operational reports and official trade data.
report_disclaimer: Supply-chain conditions change quickly; check the retrieval dates.
